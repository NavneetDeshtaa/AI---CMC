services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contract_intel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres 
      POSTGRES_DB: contract_db  
    ports:
      - "5433:5432"    # host:container — using 5433 so it won't clash with your
                        # existing native Postgres still listening on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: